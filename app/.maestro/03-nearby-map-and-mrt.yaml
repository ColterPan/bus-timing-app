# E2E: the app opens on Nearby with the closest stop's times already showing,
# then dropdown + favourite, locate-me, and the MRT map tab.
# Needs location turned on for the emulator/phone. Run: maestro test .maestro/
appId: com.colterpan.sgbustiming
---
- launchApp:
    clearState: true
# Android permission dialog (wording differs by Android version)
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible:
    id: "locate-button"
# Closest stop is labelled and its bus times show without any tap
- extendedWaitUntil:
    visible:
      id: "closest-label"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "nearby-open-.*"
    timeout: 20000
# Open a second stop's dropdown and save it
- tapOn:
    id: "nearby-toggle-.*"
    index: 1
- tapOn:
    id: "nearby-star-.*"
    index: 1
- tapOn:
    id: "locate-button"
- tapOn: "MRT Map"
- assertVisible:
    id: "mrt-lta-link"
- tapOn: "Favourites"
- assertVisible:
    id: "fav-.*"
